# Environnement de TEST jetable — Phase 0-A (tests d'installation des modules).
# Aucune donnée réelle de Fayadort. Ne jamais utiliser en production.
#
# Sécurité :
#   - nom de projet fixe « fayadort-test » : les volumes ne concernent que ce projet ;
#   - aucun port publié : la base de test n'est joignable que depuis le réseau interne du projet ;
#   - Odoo ne se connecte qu'au service « db » de ce projet (docker/odoo.test.conf).
#
# Ne pas lancer à la main : utiliser scripts/test_install.sh (qui construit l'image de test).
name: fayadort-test

services:
  db:
    # PostgreSQL 16 = version de la distribution de référence Ubuntu 24.04 (Odoo 19 exige >= 13).
    # Figer par digest avec : bash scripts/pin_postgres_digest.sh   (voir docs/01_SOCLE_ODOO19.md §3.1)
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_test_only
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 30

  odoo:
    # Construite par scripts/test_install.sh à partir de :
    #   - odoo/docker @ f900094 (dossier 19.0) : base ubuntu:noble, Python 3.12, dépendances système ;
    #   - docker/Dockerfile.test : dépendances Python supplémentaires (requirements-extra.txt).
    # Le code exécuté est celui de src/odoo (commit figé dans repos.yaml), monté en lecture seule.
    image: fayadort/odoo19-test:local
    depends_on:
      db:
        condition: service_healthy
    entrypoint: []
    command: ["sleep", "infinity"]
    volumes:
      - ../src:/mnt/src:ro
      - ./odoo.test.conf:/etc/odoo/odoo.test.conf:ro
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
